name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Check workspace targets
        run: cargo check --workspace --all-targets --locked

  release:
    name: Publish crates.io release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: crates-io-release
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Require crates.io token
        shell: bash
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "CARGO_REGISTRY_TOKEN secret is required for automatic crates.io publishing." >&2
            exit 1
          fi

      - name: Read workspace release version
        id: release
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "rpi-cli") | .version' | head -n 1)"
          if [[ -z "${version}" || "${version}" == "null" ]]; then
            echo "Could not determine the rpi-cli workspace version." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Publishing workspace version ${version}."

      - name: Build release helper
        run: rustc --edition=2021 release-helper.rs -o .git/rpi-release-helper

      - name: Validate release state
        run: .git/rpi-release-helper validate "${{ steps.release.outputs.version }}"

      - name: Publish crates in dependency order
        run: .git/rpi-release-helper publish "${{ steps.release.outputs.version }}"
