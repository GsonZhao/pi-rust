name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run workspace tests
        run: cargo test --workspace

  publish:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Publish order respects internal dependency graph.
          # Crates with no internal deps first, then dependents.
          # cargo publish skips already-published versions automatically.
          
          crates=(
            "crates/pi-telemetry"
            "crates/rpi-plugin-sdk"
            "crates/pi-tui"
            "crates/pi-ai"
            "crates/pi-agent"
            "crates/pi-tools"
            "crates/rpi-extensions"
            "crates/pi-harness"
            "crates/pi-cli"
          )
          
          for crate in "${crates[@]}"; do
            echo "::group::Publishing $(basename "$crate")"
            cargo publish --manifest-path "$crate/Cargo.toml" --allow-dirty
            echo "::endgroup::"
          done
